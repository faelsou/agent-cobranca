# Logs dos pods, menos kube-system. O Minikube grava em /var/log/pods (Docker JSON).
# Labels de stream: namespace, pod, container, service. Sem uid, para não estourar o índice.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push

scrape_configs:
  - job_name: kubernetes
    kubernetes_sd_configs:
      - role: pod
    pipeline_stages:
      # O runtime do Minikube é Docker: o arquivo é JSON com o campo log.
      - docker: {}
    relabel_configs:
      - source_labels: ["__meta_kubernetes_pod_node_name"]
        regex: ${NODE_NAME}
        action: keep
      - source_labels: ["__meta_kubernetes_pod_phase"]
        regex: Pending
        action: drop
      - source_labels: ["__meta_kubernetes_namespace"]
        regex: kube-system
        action: drop
      - source_labels: ["__meta_kubernetes_pod_node_name"]
        target_label: __host__
      - source_labels: ["__meta_kubernetes_namespace"]
        target_label: namespace
      - source_labels: ["__meta_kubernetes_pod_name"]
        target_label: pod
      - source_labels: ["__meta_kubernetes_pod_container_name"]
        target_label: container
      - source_labels: ["__meta_kubernetes_pod_label_app"]
        target_label: service
      - source_labels:
          - __meta_kubernetes_pod_uid
          - __meta_kubernetes_pod_container_name
        separator: /
        regex: (.+)
        replacement: /var/log/pods/*$1/*.log
        target_label: __path__
