apiVersion: 1

datasources:
  - name: Thanos
    uid: thanos
    type: prometheus
    access: proxy
    url: http://thanos-query:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: Abrir trace

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      timeInterval: 15s
      manageAlerts: true
      alertmanagerUid: ""
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: Abrir trace

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: Trace
          matcherRegex: "trace_id[=:]\"?(?<trace_id>[0-9a-f]{16,32})"
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Abrir trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: false
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service=~"webhook-api|api|gateway|cobranca|conci-pgto|conciliacao|cadastro|worker-cobranca|worker-conciliacao|worker-cadastro|relo-disp|beat|frontend-web|web"} |= "$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: thanos
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: service
        queries:
          - name: Requisições
            query: sum by (service) (rate(cobranca_http_requests_total[5m]))
          - name: Spans
            query: sum(rate(traces_spanmetrics_calls_total{service="${__tags.service}",span_kind="SPAN_KIND_SERVER"}[5m]))
      serviceMap:
        datasourceUid: thanos
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
      search:
        hide: false
