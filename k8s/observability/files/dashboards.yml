apiVersion: 1

providers:
  - name: cobranca
    orgId: 1
    folder: Cobrança
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/app

  - name: kubernetes
    orgId: 1
    folder: Kubernetes
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/kubernetes
