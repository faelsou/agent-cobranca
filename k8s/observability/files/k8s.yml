groups:
  - name: kubernetes
    rules:
      # Sintoma, não causa: o nó deixou de servir carga.
      - alert: KubeNodeNaoPronto
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Nó {{ $labels.node }} não está Ready"

      - alert: KubePodCrashLoop
        expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CrashLoop em {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})"

      - alert: KubePodOOM
        expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OOMKilled em {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})"

      - alert: KubePodNaoReady
        expr: |
          kube_pod_status_ready{condition="true"} == 0
          and on (namespace, pod)
          kube_pod_status_phase{phase="Running"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} em Running sem ficar Ready"

      # Saturação de CPU: o CFS está segurando o container, não só "uso alto".
      - alert: KubeContainerCPUThrottled
        expr: |
          sum by (namespace, pod, container) (
            rate(container_cpu_cfs_throttled_periods_total{container!="",container!="POD"}[5m])
          )
          /
          sum by (namespace, pod, container) (
            rate(container_cpu_cfs_periods_total{container!="",container!="POD"}[5m])
          )
          > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU throttled acima de 25% em {{ $labels.namespace }}/{{ $labels.pod }}"

      - alert: KubeMemoriaSaturada
        expr: |
          (
            sum by (namespace, pod, container) (
              container_memory_working_set_bytes{container!="",container!="POD"}
            )
            /
            sum by (namespace, pod, container) (
              kube_pod_container_resource_limits{resource="memory"} > 0
            )
          ) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memória acima de 90% do limit em {{ $labels.namespace }}/{{ $labels.pod }}"

      - alert: KubeStateMetricsFora
        expr: up{job="kube-state-metrics"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "kube-state-metrics sem scrape"

      - alert: KubeletCadvisorFora
        expr: up{job="kubelet-cadvisor"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "cAdvisor do kubelet sem scrape no nó {{ $labels.node }}"
