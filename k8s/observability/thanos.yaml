apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-store
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: thanos-store }
  template:
    metadata:
      labels: { app: thanos-store }
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: prometheus }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 0
      containers:
        - name: thanos-store
          image: thanosio/thanos:v0.37.2
          imagePullPolicy: IfNotPresent
          args:
            - store
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/thanos
            - name: objstore
              mountPath: /thanos/objstore
            - name: data
              mountPath: /var/thanos/store
      volumes:
        - name: config
          configMap:
            name: thanos-objstore
        - name: objstore
          hostPath:
            path: /data/thanos-objstore
            type: DirectoryOrCreate
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-store
spec:
  selector: { app: thanos-store }
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
    - name: http
      port: 10902
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
spec:
  replicas: 1
  selector:
    matchLabels: { app: thanos-query }
  template:
    metadata:
      labels: { app: thanos-query }
    spec:
      containers:
        - name: thanos-query
          image: thanosio/thanos:v0.37.2
          imagePullPolicy: IfNotPresent
          args:
            - query
            - --http-address=0.0.0.0:9090
            - --grpc-address=0.0.0.0:10901
            - --endpoint=thanos-sidecar:10901
            - --endpoint=thanos-store:10901
            - --query.replica-label=replica
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
spec:
  selector: { app: thanos-query }
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-compactor
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: thanos-compactor }
  template:
    metadata:
      labels: { app: thanos-compactor }
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: prometheus }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 0
      containers:
        - name: thanos-compactor
          image: thanosio/thanos:v0.37.2
          imagePullPolicy: IfNotPresent
          args:
            - compact
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --wait
            - --wait-interval=5m
            - --consistency-delay=30m
            - --retention.resolution-raw=30d
            - --retention.resolution-5m=90d
            - --retention.resolution-1h=1y
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/thanos
            - name: objstore
              mountPath: /thanos/objstore
            - name: data
              mountPath: /var/thanos/compact
      volumes:
        - name: config
          configMap:
            name: thanos-objstore
        - name: objstore
          hostPath:
            path: /data/thanos-objstore
            type: DirectoryOrCreate
        - name: data
          emptyDir: {}
