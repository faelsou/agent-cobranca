# Alvos da aplicação e do cluster. Este Prometheus vive no namespace observability.
# cAdvisor passa pelo apiserver (nodes/proxy); o ServiceAccount prometheus tem esse RBAC.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: cobranca
    replica: minikube
    monitor: cobranca

rule_files:
  - /etc/prometheus/cobranca.yml
  - /etc/prometheus/k8s.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: aiops
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["aiops:8000"]
        labels: { service: aiops }

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: cobranca-http
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["webhook-api.cobranca.svc.cluster.local:8000"]
        labels: { service: webhook-api }
      - targets: ["cobranca.cobranca.svc.cluster.local:8000"]
        labels: { service: cobranca }
      - targets: ["conci-pgto.cobranca.svc.cluster.local:8000"]
        labels: { service: conci-pgto }
      - targets: ["cadastro.cobranca.svc.cluster.local:8000"]
        labels: { service: cadastro }

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { service: postgres }

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { service: redis }

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]
        labels: { service: celery }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: kube-state-metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["kube-state-metrics:8080"]

  # Um alvo por nó, via proxy do apiserver. O label node separa as séries;
  # instance fica igual porque o endereço reescrito é o Service kubernetes.
  - job_name: kubelet-cadvisor
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        target_label: __metrics_path__
      - target_label: __address__
        replacement: kubernetes.default.svc.cluster.local:443
    metric_relabel_configs:
      # O regex é ancorado: POD| casa com o pause e com container vazio (cgroup do pod).
      - source_labels: [container]
        regex: "POD|"
        action: drop
      - action: labeldrop
        regex: id|image|name|container_id
