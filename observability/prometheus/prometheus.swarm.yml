# Prometheus no Swarm. Os alvos HTTP são o VIP do serviço na rede backend.
# Uma réplica só é raspada por vez. O piloto tem um nó de dados; isso basta.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: cobranca
    replica: swarm
    monitor: cobranca

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cobranca-http
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["webhook-api:8000"]
        labels: { service: webhook-api }
      - targets: ["cobranca:8000"]
        labels: { service: cobranca }
      - targets: ["conci-pgto:8000"]
        labels: { service: conci-pgto }
      - targets: ["cadastro:8000"]
        labels: { service: cadastro }

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { service: postgres }

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { service: redis }

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]
        labels: { service: celery }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
